<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" rx="96" fill="#7c3aed"/>
  <!-- Top-left card -->
  <rect x="72" y="72" width="160" height="160" rx="24" fill="rgba(255,255,255,0.95)"/>
  <!-- Top-right card (faded) -->
  <rect x="280" y="72" width="160" height="160" rx="24" fill="rgba(255,255,255,0.55)"/>
  <!-- Bottom-left card (faded) -->
  <rect x="72" y="280" width="160" height="160" rx="24" fill="rgba(255,255,255,0.55)"/>
  <!-- Bottom-right card (fainter) -->
  <rect x="280" y="280" width="160" height="160" rx="24" fill="rgba(255,255,255,0.3)"/>
  <!-- Accent lines on top-left card -->
  <rect x="96" y="108" width="112" height="10" rx="5" fill="#7c3aed" opacity="0.6"/>
  <rect x="96" y="128" width="80" height="8" rx="4" fill="#db2777" opacity="0.5"/>
  <rect x="96" y="146" width="96" height="8" rx="4" fill="#0ea5e9" opacity="0.5"/>
  <!-- Circle score indicator -->
  <circle cx="188" cy="192" r="22" fill="none" stroke="rgba(124,58,237,0.3)" stroke-width="4"/>
  <circle cx="188" cy="192" r="22" fill="none" stroke="#7c3aed" stroke-width="4" stroke-dasharray="110 138" stroke-linecap="round" transform="rotate(-90 188 192)"/>
</svg>
